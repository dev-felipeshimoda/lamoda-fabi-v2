<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0a0f14">
  <title>La Moda - Fabi</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='48' fill='%2300d4b4'/></svg>">
  <link rel="stylesheet" href="shared/styles.css">
</head>
<body>
  <div id="app">
    <!-- Loading inicial (enquanto o Firebase resolve o auth state) -->
    <div class="center"><div class="spinner" aria-label="Carregando"></div></div>
  </div>

  <!-- Template: tela de login -->
  <template id="tpl-login">
    <div class="center">
      <main class="card login">
        <h1 class="login__title">La Moda <span class="accent">- Fabi</span></h1>
        <p class="login__subtitle">Hub unificado de vendas VE27 e checklist pós-vendas.</p>

        <button class="btn btn--primary login__btn" data-action="signin">
          <svg width="18" height="18" viewBox="0 0 48 48" aria-hidden="true">
            <path fill="#fff" d="M44.5 20H24v8.5h11.7C34.3 33.5 29.6 36.5 24 36.5c-7.2 0-13-5.8-13-13s5.8-13 13-13c3.3 0 6.3 1.3 8.6 3.3l6.2-6.2C34.6 4.4 29.6 2.5 24 2.5 12.4 2.5 3 11.9 3 23.5S12.4 44.5 24 44.5c10.4 0 19.5-7.5 21-17.5 0-1.6.5-4.5.5-7z"/>
          </svg>
          Entrar com Google
        </button>

        <div class="login__status muted" data-login-status>
          Use a conta Google autorizada (<code>felipeshimoda@outlook.com</code>).
        </div>
      </main>
    </div>
  </template>

  <!-- Template: hub (logado) -->
  <template id="tpl-hub">
    <div class="hub">
      <header class="hub__header">
        <div class="hub__brand">La Moda <span class="accent">- Fabi</span></div>
        <div class="hub__user">
          <img class="hub__avatar" data-user-avatar alt="">
          <span class="hub__username" data-user-name></span>
          <button class="btn btn--ghost" data-action="signout">Sair</button>
        </div>
      </header>

      <div class="hub__cards">
        <a class="hub__card" href="vendas/">
          <svg class="hub__card-icon" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M3 3v18h18"/>
            <path d="M7 14l4-4 4 4 5-7"/>
          </svg>
          <div class="hub__card-title">Vendas VE27</div>
          <div class="hub__card-desc">Painel de acompanhamento da coleção VE27 — Caza Fashion.</div>
        </a>

        <a class="hub__card" href="visitas/">
          <svg class="hub__card-icon" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <rect x="5" y="4" width="14" height="17" rx="2"/>
            <path d="M9 4h6v3H9z"/>
            <path d="M9 12h6M9 16h6"/>
          </svg>
          <div class="hub__card-title">Visitas Pós-Vendas</div>
          <div class="hub__card-desc">Checklist de visitas em loja e dashboard de resultados.</div>
        </a>
      </div>

      <p class="footer">v0.0.2 — em construção</p>
    </div>
  </template>

  <script type="module" src="app.js"></script>
</body>
</html>
