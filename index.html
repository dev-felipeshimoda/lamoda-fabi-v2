<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0a0f14">
  <title>La Moda - Fabi</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='48' fill='%2300d4b4'/></svg>">
  <style>
    :root {
      --bg: #0a0f14;
      --bg-elev: #121a22;
      --fg: #e6f1f1;
      --fg-dim: #8fa3a8;
      --accent: #00d4b4;
      --border: #1e2a33;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; background: var(--bg); color: var(--fg); font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", sans-serif; }
    body { min-height: 100dvh; display: grid; place-items: center; padding: 24px; background-image: radial-gradient(circle at 20% 10%, rgba(0,212,180,0.08), transparent 40%), radial-gradient(circle at 80% 90%, rgba(0,150,140,0.06), transparent 50%); }
    main { max-width: 520px; width: 100%; padding: 32px; background: var(--bg-elev); border: 1px solid var(--border); border-radius: 16px; backdrop-filter: blur(12px); box-shadow: 0 24px 60px rgba(0,0,0,0.4); }
    h1 { margin: 0 0 8px; font-size: 28px; letter-spacing: -0.02em; }
    .accent { color: var(--accent); }
    p { margin: 8px 0; color: var(--fg-dim); line-height: 1.5; }
    .status { margin-top: 24px; padding: 16px; background: rgba(0,212,180,0.08); border: 1px solid rgba(0,212,180,0.2); border-radius: 12px; color: var(--accent); font-size: 14px; }
    code { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; background: rgba(255,255,255,0.05); padding: 2px 6px; border-radius: 4px; color: var(--fg); }
    footer { margin-top: 24px; font-size: 12px; color: var(--fg-dim); }
  </style>
</head>
<body>
  <main>
    <h1>La Moda <span class="accent">- Fabi</span></h1>
    <p>Hub unificado: vendas VE27 + checklist pós-vendas.</p>
    <p>Esta é a versão <strong>placeholder</strong> publicada na Fase B do plano de migração.</p>
    <div class="status">
      ✓ Hosting ativo · projeto <code>lamoda-fabi</code> · região São Paulo
    </div>
    <footer>v0.0.1 — em construção</footer>
  </main>
</body>
</html>
